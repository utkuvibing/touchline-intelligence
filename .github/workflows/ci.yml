name: CI

# Runs the same checks a developer runs locally. CI's job here is not to run *more* checks than the
# local command, it is to run the *same* ones from a clean machine and a locked dependency set —
# which is what catches "works on my laptop" before it reaches a reviewer.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (format, lint, types, tests)
    runs-on: ubuntu-latest

    # Present so the ingestion tests can exercise the *successful* load path, not only the failure
    # paths. Those tests use the committed fixture and an isolated PostgreSQL schema - CI never
    # downloads the real StatsBomb dataset.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: touchline
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: touchline
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U touchline -d touchline"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Setting this un-skips the integration tests; without it they are skipped, which is the
      # right default for a developer with no database running.
      TOUCHLINE_DB_URL: postgresql://touchline:localdev@localhost:5433/touchline
      # TOUCHLINE_FULL_COHORT_DB_URL is deliberately NOT set. It gates the WP2.2/WP2.3 measured-evidence
      # tests, which read the ingested four-tournament cohort. CI never downloads or loads the real
      # StatsBomb dataset, so it has no cohort to read and those tests skip with a stated reason.
      # Setting it here would make CI assert 5,606 rows against a database that has none.

    steps:
      # WP2.5 artifact integrity resolves uv.lock at its recorded reproduction commit. A shallow
      # checkout can turn missing history into an unreproducible evidence claim, so keep history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        # Pinned exactly: setup-uv publishes no floating `v9` major tag, only `v9.0.0`.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # --locked fails if uv.lock does not match pyproject.toml, so a dependency change that was
      # never locked cannot pass CI.
      - name: Install dependencies
        run: uv sync --locked

      # The service container starts healthy but empty. Tests that build their own isolated schema
      # do not care, but the readiness checks read the *default* schema and would see a database
      # permanently "behind" this build — reporting drift that is an artefact of the runner rather
      # than of the code. Applying the ordered migrations gives them a current schema to assert
      # against. This is schema only: no StatsBomb download, no ingestion, no cohort.
      - name: Apply ordered migrations to the CI database
        run: uv run poe migrate

      # Deliberately the same single command as `uv run poe check` locally. If CI and local
      # commands drift apart, CI stops meaning anything.
      - name: Run checks
        run: uv run poe check

  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs strictly from the lockfile and fails if package.json disagrees with it.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  # The ops tests still point at an unreachable DSN of their own to prove /ready degrades; the
  # service container above is for the ingestion tests, which need a real database to prove that a
  # failed reconciliation leaves nothing committed.

  image:
    name: Backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Builds only. Deployment stays with Railway's and Vercel's own Git integrations, so no
      # platform token ever becomes a repository secret. What this catches is a Dockerfile that
      # stopped building - which would otherwise surface as a failed deploy after the merge, when
      # it is more expensive to diagnose.
      - name: Build
        run: docker build -t touchline-api:ci .

      # A built image that cannot start is still broken. This is the cheapest possible proof that
      # the entrypoint resolves and the app imports: no database, no port, just `--help`.
      - name: Entrypoint resolves
        run: docker run --rm --entrypoint uvicorn touchline-api:ci --help

      # The modeling group contains the Windows/Linux PyTorch training stack. Production installs
      # no default groups, so the image must prove both API importability and Torch absence.
      - name: Training dependencies stay outside production
        run: >-
          docker run --rm --entrypoint python
          -e TOUCHLINE_DB_URL=postgresql://touchline:test@127.0.0.1:1/touchline
          touchline-api:ci -c
          'import importlib.util; import touchline.main;
          assert importlib.util.find_spec("torch") is None'
