[project]
name = "touchline"
version = "0.1.0"
description = "Touchline Intelligence Platform — football research and decision-support on StatsBomb Open Data"
requires-python = ">=3.12,<3.13"

# Only what a mandatory WP0.1 deliverable needs. Do not add libraries "for later".
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "psycopg[binary]",
    "psycopg-pool",
    "numpy>=2.5.1",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",          # required by fastapi.testclient
    "ruff",
    "mypy",
    "poethepoet",     # command runner; a Python dep, so no system install needed on Windows
]
modeling = [
    "torch==2.13.0",
]

[tool.uv]
default-groups = ["dev", "modeling"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/touchline"]

# ---------------------------------------------------------------------------
# Command matrix — one runner, invoked as `uv run poe <name>`
# ---------------------------------------------------------------------------
[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "mypy backend"
test = "pytest"
check = ["format-check", "lint", "typecheck", "test"]
api = "uvicorn touchline.main:app --reload --app-dir backend/src"
migrate = "python -m touchline.ingest.migrate"
ingest = "python -m touchline.ingest.cli"
quality = "python -m touchline.quality_cli"
train = "python -m touchline.modeling.train"
train-boosting = "python -m touchline.boosting_bootstrap"
train-mlp = "python -m touchline.pytorch_bootstrap"
qualify-mlp = "python -m touchline.modeling.qualify_mlp"
wp2-7-calibrate = "python -m touchline.modeling.wp2_7 calibrate"
wp2-7-holdout = "python -m touchline.modeling.wp2_7 holdout"
wp2-8-release = "python -m touchline.modeling.wp2_8 release"
wp3-1-docker-acceptance = "python scripts/verify_wp3_1_docker.py"
reproducibility-fixture = "pytest backend/tests/test_wp1_6_fixture_manifest.py backend/tests/test_wp1_6_reproducibility_integration.py"
validation-pr = "python -m touchline.validation_tiers pr"
validation-milestone = "python -m touchline.validation_tiers milestone"
validation-release = "python -m touchline.validation_tiers release"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend/src"
packages = ["touchline"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a running PostgreSQL (skipped unless TOUCHLINE_DB_URL is set)",
    "cuda: requires the local locked CUDA-capable PyTorch environment and a CUDA device",
    "full_source: slow acceptance test over the cached pinned four-tournament source",
    # Distinct from `integration`: those tests build what they need in an isolated schema, so any
    # empty PostgreSQL satisfies them. These read a database that must already hold the ingested
    # four-tournament cohort, which CI's service container deliberately does not.
    "full_cohort: requires a database already holding the ingested four-tournament cohort (skipped unless TOUCHLINE_FULL_COHORT_DB_URL is set)",
]
